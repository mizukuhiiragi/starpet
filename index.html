<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StarPet (星の子) — レトロドット液晶 × Stellar Soroban</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
  <div class="stars-bg"></div>

  <main class="device-container">
    <!-- シックなレトロ・サイバー液晶端末 -->
    <div class="pixel-terminal">
      <!-- 端末ヘッダー -->
      <header class="terminal-header">
        <div class="terminal-title">
          <span class="status-dot"></span>
          <span class="title-text">STAR-PET // OBSERVATORY v1.0</span>
        </div>
        <div class="terminal-network">STELLAR SOROBAN</div>
      </header>

      <!-- メインLCD液晶画面 -->
      <div class="lcd-monitor">
        <div class="scanlines"></div>
        <div class="crt-glow"></div>

        <!-- 状態インジケーター -->
        <div class="screen-header-icons">
          <span class="icon-indicator" id="ind-food" title="おなか">🍙</span>
          <span class="icon-indicator" id="ind-tea" title="お茶会">☕</span>
          <span class="icon-indicator" id="ind-love" title="ごきげん">💖</span>
          <span class="icon-indicator" id="ind-star" title="星の数">⭐</span>
        </div>

        <!-- メインペット画面 -->
        <div class="lcd-view" id="view-pet">
          <div class="lcd-status-bar">
            <span id="txt-generation">GEN: 1st</span>
            <span id="txt-stars">⭐ × 12</span>
          </div>

          <div class="pet-stage">
            <canvas id="pet-canvas" width="64" height="64"></canvas>
            <div class="falling-food" id="falling-food"></div>
            <div class="guest-pet" id="guest-pet"></div>
            <div class="speech-bubble" id="speech-bubble">ピピッ！</div>
          </div>

          <div class="lcd-gauges">
            <div class="gauge-row">
              <span>HUNGER:</span>
              <div class="gauge-bar"><div class="gauge-fill" id="gauge-hunger" style="width: 70%;"></div></div>
            </div>
            <div class="gauge-row">
              <span>GROWTH:</span>
              <div class="gauge-bar"><div class="gauge-fill gauge-growth" id="gauge-growth" style="width: 35%;"></div></div>
            </div>
          </div>
        </div>

        <!-- 星座NFT 旅立ち儀式画面（Canvas手書きデコ） -->
        <div class="lcd-view hidden" id="view-ascend">
          <div class="ascend-title">🌌 旅立ちの星座式 🌌</div>
          <p class="ascend-desc">寿命を迎えた星の子に、名前や感謝を刻んで夜空へ還しましょう。</p>
          
          <div class="canvas-container">
            <canvas id="nft-canvas" width="300" height="380"></canvas>
          </div>

          <div class="canvas-tools">
            <div class="color-picker">
              <button class="color-btn active" data-color="#ffd166" style="background:#ffd166;" title="金"></button>
              <button class="color-btn" data-color="#06d6a0" style="background:#06d6a0;" title="翡翠"></button>
              <button class="color-btn" data-color="#38bdf8" style="background:#38bdf8;" title="青"></button>
              <button class="color-btn" data-color="#ff70a6" style="background:#ff70a6;" title="桃"></button>
              <button class="color-btn" data-color="#ffffff" style="background:#ffffff;" title="白"></button>
            </div>
            <div class="action-buttons">
              <button class="tool-btn" id="btn-stamp-star">⭐ スタンプ</button>
              <button class="tool-btn" id="btn-clear-canvas">↺ リセット</button>
            </div>
          </div>

          <div class="mint-action">
            <button class="btn-mint" id="btn-mint-nft">
              ✨ 集めた星で空に還す (0.00001 XLM)
            </button>
          </div>
        </div>

        <!-- 星座美術館（ギャラリー）画面 -->
        <div class="lcd-view hidden" id="view-gallery">
          <div class="gallery-title">🏛️ 永世星座ギャラリー</div>
          <div class="gallery-grid" id="gallery-grid">
            <div class="empty-gallery">まだ夜空に還った星の子はいません。<br>Aボタンで星をあげて育ててね！</div>
          </div>
          <button class="btn-back-pet" id="btn-back-from-gallery">↩ 観測画面へ戻る</button>
        </div>
      </div>

      <!-- 操作コントロールパネル（モダン・フラットな端末キー） -->
      <nav class="terminal-controls">
        <button class="control-btn" id="btn-a">
          <span class="btn-icon">⭐</span>
          <span class="btn-text">[A] エサ</span>
        </button>
        <button class="control-btn btn-highlight" id="btn-b">
          <span class="btn-icon">☕</span>
          <span class="btn-text">[B] お茶会</span>
        </button>
        <button class="control-btn" id="btn-c">
          <span class="btn-icon">🌌</span>
          <span class="btn-text">[C] 星座録</span>
        </button>
      </nav>

      <footer class="terminal-footer">
        <span>© 2026 Mizuku Hiiragi • Non-custodial StarPet Companion</span>
      </footer>
    </div>
  </main>

  <!-- 音声トグル -->
  <button class="sound-toggle" id="btn-sound" title="サウンド切替">🔊 SOUND ON</button>

  <script src="app.js"></script>
</body>
</html>
